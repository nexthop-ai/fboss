name: Select build region
description: >
  Point fboss/oss/scripts/region.env and region.repo at the build endpoints of
  the region this runner is in (fboss/oss/scripts/set-region.sh). Every job
  that builds the fboss builder image or starts a builder container needs this
  after checkout; there is no default region.

runs:
  using: composite
  steps:
    - name: Detect cloud provider
      id: detect
      uses: nexthop-ai/nh/.github/actions/detect-cloud-provider@main
    - name: Select build region
      shell: bash
      env:
        PROVIDER: ${{ steps.detect.outputs.provider }}
      run: ./fboss/oss/scripts/set-region.sh "${PROVIDER}"
