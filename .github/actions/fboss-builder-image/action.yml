name: Build or restore FBOSS builder image
description: >
  Pull the FBOSS build Docker image from the registry cache (keyed on the
  Dockerfile + setup scripts), or build it fresh and push to the cache on a
  miss.  The result is tagged as fboss_image_${USER}:latest.

inputs:
  registry:
    description: Container registry host
    required: false
    default: container-registry.sw.internal.nexthop.ai

runs:
  using: composite
  steps:
    - name: Build FBOSS Docker image (with registry cache)
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        CACHE_IMAGE="${REGISTRY}/fboss-builder:cache"
        # Compute cache key from Dockerfile + build scripts
        CACHE_KEY=$(cat fboss/oss/docker/Dockerfile fboss/oss/docker/setup_clang.sh requirements-dev.txt .pre-commit-config.yaml 2>/dev/null | sha256sum | cut -c1-12)
        CACHE_TAG="${CACHE_IMAGE}-${CACHE_KEY}"

        # Try to pull cached image
        if docker pull "${CACHE_TAG}" 2>/dev/null; then
          echo "Cache hit: ${CACHE_TAG}"
          docker tag "${CACHE_TAG}" "fboss_image_${USER}:latest"
        else
          echo "Cache miss, building image..."
          ./fboss/oss/scripts/nhfboss-docker-build.py
          # Push to registry for next run
          docker tag "fboss_image_${USER}:latest" "${CACHE_TAG}"
          docker push "${CACHE_TAG}" || echo "Warning: failed to push cache image"
        fi
