name: Trigger NH Sync

on:
  pull_request:
    branches:
      - main
      - '20*'
    types: [closed]

jobs:
  sync-nh:
    if: github.event.pull_request.merged == true
    uses: nexthop-ai/nh/.github/workflows/update-submodule-pointer.yml@main
    with:
      superproject_repo: nexthop-ai/nh
      submodule_repo: ${{ github.repository }}
      submodule_path: fboss
      advance_syncs: true
    secrets:
      GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
      GH_TOKEN_PR_APPROVER: ${{ secrets.NEXTHOP_ORG_GHA_PAT }}
