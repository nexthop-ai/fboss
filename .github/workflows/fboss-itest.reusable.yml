name: FBOSS Integration Test Helper

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "Token used to clone nh repo if workflow is not run from nh repo"
        required: false
      AWS_NEXIS_BUILDRUNNER_SSH_KEY:
        description: "AWS Nexis SSH Key"
        required: true
      AZURE_NEXIS_BUILDRUNNER_SSH_KEY:
        description: "Azure Nexis SSH Key"
        required: true
      NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY:
        description: "TaskRabbit SSH Key"
        required: true
    inputs:
      build_id:
        description: "Build ID to use for testing"
        required: true
        type: string
      priority:
        description: "Priority of the test (0-100, higher values indicate higher priority)"
        required: false
        type: number
        default: 50
      target_testbeds:
        description: "Comma-separated testbed names or regex patterns (e.g., 'fboss101,fboss102' or 'fboss\\d+')"
        required: false
        type: string
        default: ""
      file_path_filter:
        description: "Glob pattern to filter tests (e.g., 'tests/bgp/*'). If not provided, defaults to --all-eligible-tests."
        required: false
        type: string
        default: ""
    outputs:
      batch_id:
        description: "The batch ID generated by the scheduler"
        value: ${{ jobs.fboss-itest.outputs.batch_id }}

jobs:
  fboss-itest:
    name: FBOSS Integration Test
    runs-on: cloudstack-ubuntu24-small
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    outputs:
      batch_id: ${{ steps.schedule-tests.outputs.batch_id }}

    env:
      BUILD_ID: ${{ inputs.build_id }}
      PRIORITY: ${{ inputs.priority }}
      TARGET_TESTBEDS: ${{ inputs.target_testbeds }}
      FILE_PATH_FILTER: ${{ inputs.file_path_filter }}

    steps:
      - name: "Install NHTools"
        uses: nexthop-ai/nh/.github/actions/install-nhtools@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          aws_ssh_key: ${{ secrets.AWS_NEXIS_BUILDRUNNER_SSH_KEY }}
          azure_ssh_key: ${{ secrets.AZURE_NEXIS_BUILDRUNNER_SSH_KEY }}
          taskrabbit_ssh_key: ${{ secrets.NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::867344435357:role/GitHubActions-EC2-Role
          aws-region: us-east-2
          role-duration-seconds: 14400 # 4 hours timeout
          output-env-credentials: true

      - name: Schedule FBOSS tests
        id: schedule-tests
        run: |
          # Build the nh te schedule command
          CMD="nh te schedule"
          CMD="$CMD --build-id $BUILD_ID"
          CMD="$CMD --test-env fboss"
          CMD="$CMD --nos fboss"
          CMD="$CMD --priority $PRIORITY"

          # Use file_path_filter if provided, otherwise default to all eligible tests
          if [ -n "$FILE_PATH_FILTER" ]; then
            CMD="$CMD --file-path-filter $FILE_PATH_FILTER"
          else
            CMD="$CMD --all-eligible-tests"
          fi

          if [ -n "$TARGET_TESTBEDS" ]; then
            CMD="$CMD --target-testbeds $TARGET_TESTBEDS"
          fi

          exit_code=0
          output=$($CMD 2>&1) || exit_code=$?

          # Try to extract Batch ID
          batch_id=$(echo "$output" | grep "Batch ID:" | awk '{print $3}')

          # Success Condition: Exit code is 0 AND Batch ID is a valid number
          if [[ ${exit_code:-0} -eq 0 ]] && [[ -n "$batch_id" ]] && [[ "$batch_id" =~ ^[0-9]+$ ]] && [[ "$batch_id" -ne 0 ]]; then
            echo "✅ Success! Batch ID: $batch_id"
            echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Attempt failed."
            echo "$output"
            exit 1
          fi
