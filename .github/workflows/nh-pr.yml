name: NH PR

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Reusable workflows cannot grant themselves broader permissions than the
# caller allows — declare them here so the reusable's job-level requests
# for `checks: read` (poseidon status wait), `contents: read` (private
# stars-post-results action download), and `actions: read` (startup-failure
# check) actually apply.
permissions:
  checks: read
  contents: read
  actions: read

jobs:
  merge-status:
    uses: nexthop-ai/nh/.github/workflows/nh-pr.reusable.yml@main
    secrets: inherit
    with:
      # Smoke Tests: currently failing due to scheduling issues.
      # cli-integration-test / Integration-Test: not yet reliable.
      extra_ignore_pattern: '^(Smoke Tests / |cli-integration-test / Integration-Test)'
