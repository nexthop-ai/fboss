name: NH PR

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-status:
    name: NH Merge Status
    runs-on: k8s-nano
    permissions:
      checks: read
    steps:
      - name: Wait for all checks to pass or be skipped
        # Pinned to a post-v0.6.0 SHA that includes the dedupe fix from
        # https://github.com/poseidon/wait-for-status-checks/pull/627 (merged 2025-07-19,
        # unreleased pending https://github.com/poseidon/wait-for-status-checks/issues/851).
        # Without this fix the action treats concurrency-cancelled check runs as failures
        # even when a successful re-run exists for the same SHA, blocking merges that
        # actually have all required checks green.
        uses: poseidon/wait-for-status-checks@990a77d11cde85fd8897cb1747d2701ea9565615  # v0.6.0 + #627
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ignore this job to avoid waiting on itself.
          ignore: "NH Merge Status"
          # Wait on the grecs-pr/* jobs directly, in addition to the
          # grecs-pr / grecs-validation aggregator (which stays a required check
          # while dependent repos still list it). This is the prerequisite for
          # eventually retiring grecs-validation. The #627 dedupe fix above keeps
          # concurrency-cancelled grecs runs from blocking the merge when a
          # successful re-run exists for the same SHA.
          #
          # "STARS: *" checks are posted after NH PR completes and report on
          #   this workflow's own jobs; gating on them deadlocks re-runs
          # Smoke Tests: Often fail right now due to failure to schedule
          # PR Validation / cli-integration-test / Integration-Test: Not yet reliable
          # (DEVX-3572). Downstream triage signal, not a merge precondition.
          ignore_pattern: "^(STARS: |Smoke Tests / |PR Validation / cli-integration-test / Integration-Test)"
          # 8h: longest observed successful PR CI across our repos is ~6.5h
          # (sonic image build + hardware tests). Failed checks fail fast
          # regardless, so this only bounds the wait for slow successes.
          timeout: 28800
