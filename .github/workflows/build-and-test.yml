name: Build and Test
run-name: Build and Test FBOSS (SAI ${{ inputs.sai_version }})

on:
  workflow_call:
    inputs:
      sai_version:
        description: "SAI version to build against"
        required: false
        default: "1.16.1"
        type: string
      use_clang:
        description: "Use Clang instead of GCC"
        required: false
        default: false
        type: boolean
      ref:
        description: "Git ref to checkout (branch, tag, or SHA)"
        required: false
        default: ""
        type: string
    outputs:
      failed_tests:
        description: "List of failed tests (up to 10)"
        value: ${{ jobs.Build-and-Test.outputs.failed_tests }}
      failed_test_count:
        description: "Total number of failed tests"
        value: ${{ jobs.Build-and-Test.outputs.failed_test_count }}
  # Allow manual dispatch for branch-level A/B testing during GARM rollout.
  workflow_dispatch:
    inputs:
      sai_version:
        description: "SAI version to build against"
        required: false
        default: "1.16.1"
        type: string
      use_clang:
        description: "Use Clang instead of GCC"
        required: false
        default: true
        type: boolean

# Pin job counts for cloudstack-ubuntu24-large so the getdeps cmake-defines
# string is byte-identical across fresh VMs of the same flavor, giving stable
# per-dep cache keys.  Adjust if/when the flavor specs change.
# Derivation: large runner has ~64 GB RAM.
#   LINK_JOBS  = floor(64 / 11) = 5  (each link job peaks at ~11 GB)
#   COMPILE_JOBS = nproc(32) * 20 = 640, capped by RAM: 64*5=320
env:
  NHFBOSS_LINK_JOBS: "5"
  NHFBOSS_COMPILE_JOBS: "320"
  GETDEPS_CACHE_URL: "http://bucket.internal.nexthop.ai:7480/image-stash/getdeps-cache"
  GETDEPS_CACHE_UPLOAD: "1"
  FBOSS_SIM_CACHE_REF: "container-registry.sw.internal.nexthop.ai/fboss-sim-runtime:buildcache"

jobs:
  Build-and-Test:
    if: github.repository_owner == 'nexthop-ai'
    runs-on: cloudstack-ubuntu24-large
    outputs:
      failed_tests: ${{ steps.parse-test-results.outputs.failed_tests }}
      failed_test_count: ${{ steps.parse-test-results.outputs.failed_test_count }}
    steps:
      - name: Set up HTTP proxy
        uses: nexthop-ai/nh/.github/actions/http-proxy@main

      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          # For PRs, checkout the actual PR head (not the synthetic merge commit)
          ref: ${{ inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.ref }}
          # Most PRs will be fewer than 20 commits
          fetch-depth: 20

      - name: Fetch base branch and deepen history for PR diff
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base branch so we can compute merge-base
          git fetch --no-tags origin ${{ github.base_ref }}
          # Deepen history until merge-base is found
          DEPTH=${{ github.event.pull_request.commits }}
          while ! git merge-base origin/${{ github.base_ref }} HEAD >/dev/null 2>&1; do
            DEPTH=$(( DEPTH + 50 ))
            git fetch --deepen=$DEPTH --no-tags origin ${{ github.base_ref }} ${{ github.head_ref }}
          done

      - name: Build FBOSS Docker image (with registry cache)
        uses: ./.github/actions/fboss-builder-image

      - name: Start FBOSS build container
        run: ./fboss/oss/scripts/nhfboss-docker-enter.py

      - name: Fetch prebuilt SAI
        run: |
          docker exec \
            -e SAI_VERSION=${{ inputs.sai_version || '1.16.1' }} \
            FBOSS_build_${USER} \
            bash fboss/oss/scripts/ensure-sai.sh

      - name: Fetch dependencies
        run: |
          docker exec \
            -e GETDEPS_CACHE_URL=${{ env.GETDEPS_CACHE_URL }} \
            -e GETDEPS_CACHE_UPLOAD=${{ env.GETDEPS_CACHE_UPLOAD }} \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-get-deps.sh

      - name: Build FBOSS
        run: |
          # Only install the final binaries for scheduled events (nightly builds).
          # Other workflows don't need them and they're expensive to install.
          target=${{ github.event_name == 'schedule' && 'install' || 'all' }}
          docker exec \
            -e SAI_VERSION=${{ inputs.sai_version || '1.16.1' }} \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target $target
          docker cp FBOSS_build_${USER}:/var/FBOSS/tmp_bld_dir/build/fboss/fboss2-dev ./fboss2-dev
          docker cp FBOSS_build_${USER}:/var/FBOSS/tmp_bld_dir/build/fboss/fboss2_integration_test ./fboss2_integration_test

      - name: Collect sccache statistics
        if: always()
        run: |
          docker exec FBOSS_build_${USER} sccache -s

      - name: Package FBOSS binaries and library dependencies
        run: |
          # package-fboss.py produces a ~3 GB tarball (all fboss binaries + ldd deps).
          # We only need fboss2_integration_test and fboss2-dev, so run ldd on those
          # two, collect only their .so deps, and tar the result (~50-200 MB).
          docker exec FBOSS_build_${USER} bash -c '
            set -euo pipefail
            BUILD=/var/FBOSS/tmp_bld_dir/build/fboss
            PKG=$(mktemp -d -p /var/FBOSS/tmp_bld_dir)
            trap "rm -rf \"$PKG\"" EXIT
            mkdir -p $PKG/bin $PKG/lib
            cp -a $BUILD/fboss2_integration_test $BUILD/fboss2-dev $PKG/bin/
            for bin in $PKG/bin/*; do
              ldd "$bin" 2>/dev/null | awk "/=>/ { print \$3 }" | grep -v "^$"
            done | sort -u | while read lib; do
              # -L dereferences: many libc/libssl/etc libs are a versioned
              # SONAME symlinked from an unversioned filename, and cp -a
              # alone would copy the symlink itself. That symlink packs into
              # the tarball pointing at the build containers absolute path,
              # which does not exist once extracted on the runner/DUT, so the
              # lib silently fails the "-f" check downstream and never ships.
              # Copy the real file content instead. (No apostrophes in this
              # comment block: it lives inside the single-quoted bash -c
              # script below, so one would terminate the string early.)
              [ -f "$lib" ] && cp -aL "$lib" $PKG/lib/ || true
            done
            ZSTD_NBTHREADS=0 tar -cf /var/FBOSS/tmp_bld_dir/fboss_cli_bins.tar.zst --zstd -C $PKG .
            echo "Size: $(du -sh /var/FBOSS/tmp_bld_dir/fboss_cli_bins.tar.zst)"
          '
          docker cp FBOSS_build_${USER}:/var/FBOSS/tmp_bld_dir/fboss_cli_bins.tar.zst ./fboss_cli_bins.tar.zst

      - name: Upload FBOSS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fboss_cli_bins
          path: ./fboss_cli_bins.tar.zst

      - name: Parse NHCI annotations
        id: nhci
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Parse NHCI annotations from PR body
          # Format: NHCI: key=value
          # Supported: clang-tidy=skip|warn-only
          CLANG_TIDY_MODE="normal"
          if echo "$PR_BODY" | grep -qF "NHCI: clang-tidy=skip"; then
            echo "Found 'NHCI: clang-tidy=skip' in PR body, skipping clang-tidy entirely"
            CLANG_TIDY_MODE="skip"
          elif echo "$PR_BODY" | grep -qF "NHCI: clang-tidy=warn-only"; then
            echo "Found 'NHCI: clang-tidy=warn-only' in PR body, clang-tidy errors will not fail the build"
            CLANG_TIDY_MODE="warn-only"
          fi
          echo "clang_tidy_mode=$CLANG_TIDY_MODE" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy
        id: clang-tidy
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip'
        run: |
          echo "Current HEAD: $(git rev-parse HEAD)"

          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # For sync PRs, find the merge commit and use it as base (so we only lint our changes, not upstream)
          SYNC_MERGE_COMMIT=$(git log ${MERGE_BASE}..HEAD --first-parent --merges --grep="^Sync with upstream stable commit" -1 --format="%H" 2>/dev/null || true)
          if [[ -n "$SYNC_MERGE_COMMIT" ]]; then
            echo "Detected sync PR with merge commit: $SYNC_MERGE_COMMIT"
            BASE_REF="$SYNC_MERGE_COMMIT"
          else
            echo "PR merge-base: $MERGE_BASE"
            BASE_REF="$MERGE_BASE"
          fi

          # Save BASE_REF for reviewdog step
          echo "$BASE_REF" > /tmp/clang_tidy_base_ref.txt

          # Run clang-tidy on all C++ files changed in this PR and save output for reviewdog
          docker exec -e BASE_REF="$BASE_REF" FBOSS_build_${USER} bash -c '
            cd /var/FBOSS/fboss
            python3 fboss/oss/scripts/run-clang-tool.py --no-run-if-empty --range "$BASE_REF..HEAD" 2>&1
          ' | tee /tmp/clang-tidy-output.txt
          if [[ ! -s /tmp/clang-tidy-output.txt ]]; then
            echo "clang-tidy produced no output, everything's perfectly tidy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Post-process clang-tidy output:
          # - Strip container path prefix so reviewdog can find files
          # - Add helpful suggestions for banned headers
          sed -i \
            -e 's|/var/FBOSS/fboss/||g' \
            -e 's/system include regex not allowed/system include regex not allowed (use RE2 instead)/g' \
            /tmp/clang-tidy-output.txt

      - name: Setup reviewdog
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip' && steps.clang-tidy.outputs.skip != 'true'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Post clang-tidy comments
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip' && steps.clang-tidy.outputs.skip != 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_REF=$(cat /tmp/clang_tidy_base_ref.txt 2>/dev/null || echo "origin/${{ github.base_ref }}")
          FAIL_LEVEL="${{ steps.nhci.outputs.clang_tidy_mode == 'warn-only' && 'none' || 'error' }}"
          cat /tmp/clang-tidy-output.txt | \
            reviewdog \
              -efm="%f:%l:%c: %tarning: %m" \
              -efm="%f:%l:%c: %trror: %m" \
              -name="clang-tidy" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -fail-level="$FAIL_LEVEL" \
              -diff="git diff $BASE_REF..HEAD"

      - name: Run unit tests
        id: run-tests
        run: |
          docker exec \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-test.sh 2>&1 | tee /tmp/test_output.log
          exit ${PIPESTATUS[0]}

      - name: Parse test results
        id: parse-test-results
        if: always()
        run: |
          if [[ -f /tmp/test_output.log ]]; then
            # Extract failed test names from CTest output
            # Format: "	 46 - CmdShowHostTestFixture.sortModel (Failed)"
            all_failed=$(sed -nE '/The following tests FAILED:/,$ s/^\s+[0-9]+ - (.+) \(Failed\)$/\1/p' /tmp/test_output.log)
            failed_tests=$(echo "$all_failed" | head -5)
            if [[ -n "$all_failed" ]]; then
              failed_count=$(echo "$all_failed" | wc -l)
            else
              failed_count=0
            fi

            echo "failed_test_count=$failed_count" >> "$GITHUB_OUTPUT"
            echo "failed_tests<<EOF" >> "$GITHUB_OUTPUT"
            echo "$failed_tests" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"

            echo "Found $failed_count failed test(s)"
            if [[ -n "$all_failed" ]]; then
              echo "Failed tests:"
              echo "$all_failed"
            fi
          else
            # File doesn't exist - tests never ran (build likely failed earlier)
            echo "failed_test_count=" >> "$GITHUB_OUTPUT"
            echo "failed_tests=" >> "$GITHUB_OUTPUT"
            echo "Test output not found - tests did not run (build may have failed)"
          fi

      - name: Clean build directory for fake SAI build
        run: |
          # Remove build artifacts
          sudo rm -rf .build_dir/build/fboss .build_dir/installed/fboss .build_dir/installed/sai_impl-*
          # Revert/remove manifests modified/created by build-helper.py (testing on host due to bind mount)
          git checkout build/fbcode_builder/manifests/libsai build/fbcode_builder/manifests/fboss
          rm -f build/fbcode_builder/manifests/sai_impl

      - name: Fetch dependencies (fake SAI)
        run: |
          # We have checked out manifests/libsai. Now either we run get-deps.sh or make sure the libs remains here
          # from a previous run. The later is unpredictable. For any reason if the libs gets deleted, the build
          # step will fail, so lets run the get-deps.sh
          docker exec \
            -e GETDEPS_CACHE_URL=${{ env.GETDEPS_CACHE_URL }} \
            -e GETDEPS_CACHE_UPLOAD=${{ env.GETDEPS_CACHE_UPLOAD }} \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-get-deps.sh

      - name: Build FBOSS with Fake SAI
        run: |
          docker exec \
            -e SAI_IMPL=fake \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target fboss_fake_agent_targets
          docker exec \
            -e SAI_IMPL=fake \
            -e NHFBOSS_COMPILE_JOBS=${{ env.NHFBOSS_COMPILE_JOBS }} \
            -e NHFBOSS_LINK_JOBS=${{ env.NHFBOSS_LINK_JOBS }} \
            FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target fboss2_targets --cmake-target fsdb

      - name: Collect fboss-sim artifacts (inside CentOS build container)
        # ldd must resolve CentOS libs, so collect inside the build container.
        run: docker exec FBOSS_build_${USER} python3 fboss-sim/scripts/fboss-sim-docker-package.py --collect-only

      # bgpd comes from the monorepo. Best effort throughout: any failure here
      # drops BGP from the image rather than failing the job.
      - name: Check out nh for the bgpd RPM
        id: nh-checkout
        continue-on-error: true
        uses: nexthop-ai/nh/.github/actions/gitproxy-checkout@main
        with:
          repository: nexthop-ai/nh
          ref: main
          path: nh
          token: ${{ secrets.RABBIT_NEXTHOP_PAT }}
          submodules: true
          submodule-list: "BGP fboss"

      # bgpd builds against fboss's stable hashes, so it must be built against
      # the same fboss as the image or the thrift ABI can skew (see #1242).
      - name: Pin nh's fboss submodule to this PR
        id: nh-fboss-pin
        if: steps.nh-checkout.outcome == 'success'
        continue-on-error: true
        env:
          FBOSS_SHA: ${{ inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
        run: |
          git -C nh/fboss fetch --depth 1 origin "$FBOSS_SHA"
          git -C nh/fboss checkout --detach FETCH_HEAD

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        if: steps.nh-fboss-pin.outcome == 'success'
        continue-on-error: true
        with:
          bazelisk-cache: true

      # Normally a remote-cache hit: Monobuild builds this target on every
      # fboss PR. The timeout caps a cold miss, which compiles bgp++ outright.
      - name: Build the bgpd RPM (//BGP:distro_bgpd.rpm)
        id: bgpd-rpm
        if: steps.nh-fboss-pin.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          (cd nh && bazel build //BGP:distro_bgpd.rpm)
          mkdir -p .build_dir/downloads
          cp nh/bazel-bin/BGP/distro_bgpd.rpm .build_dir/downloads/

      # .build_dir is .dockerignore'd; nh/ is not, and must not reach the
      # Docker build context.
      - name: Drop the nh checkout before the image build
        if: always() && steps.nh-checkout.outcome == 'success'
        run: rm -rf nh

      - name: Build fboss-sim runtime image (host has the Docker daemon)
        run: |
          if [ ! -f .build_dir/downloads/distro_bgpd.rpm ]; then
            echo "::warning::no bgpd RPM built; fboss-sim image will not include BGP"
          fi
          python3 fboss-sim/scripts/fboss-sim-docker-package.py --build-only

      - name: Start fboss-sim runtime container
        run: python3 fboss-sim/scripts/fboss-sim-docker-run.py

      - name: Wait for agent services to be ready
        run: |
          for i in $(seq 1 5); do
            elapsed=$(( (i - 1) * 2 ))
            if docker exec fboss_sim_runtime_${USER} /opt/fboss/bin/fboss2 show interface 2>/dev/null; then
              echo "✓ Agent ready after ${elapsed}s"
              exit 0
            fi
            echo "  [${elapsed}s] not ready yet, retrying..."
            sleep 2
          done
          echo "❌ Agent not ready after 10s"
          docker exec fboss_sim_runtime_${USER} tail -n 50 /var/facebook/logs/fboss/wedge_agent.log || true
          exit 1

      - name: Detect changed files
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cli:
              - 'fboss/cli/**'

      - name: Run fboss2 integration test
        if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.changes.outputs.cli == 'true'
        run: |
          docker exec fboss_sim_runtime_${USER} /opt/fboss/bin/fboss2_integration_test

      # The cleanup step below destroys the runtime container, so on a
      # readiness or integration-test failure capture both agents' journals,
      # restart counts, and the crash stacks from wedge_agent.log while the
      # container still exists.
      - name: Dump fboss-sim agent diagnostics on failure
        if: failure()
        run: |
          C=fboss_sim_runtime_${USER}
          echo "=== systemctl status (restart counts) ==="
          docker exec $C systemctl status fboss_sw_agent 'fboss_hw_agent@0' --no-pager -l || true
          echo "=== journalctl fboss_hw_agent@0 ==="
          docker exec $C journalctl -u 'fboss_hw_agent@0' --no-pager -n 300 || true
          echo "=== journalctl fboss_sw_agent ==="
          docker exec $C journalctl -u fboss_sw_agent --no-pager -n 100 || true
          echo "=== wedge_agent.log crash stacks ==="
          docker exec $C bash -c "grep -B5 -A40 'Aborted at\|Check failure' /var/facebook/logs/fboss/wedge_agent.log | tail -150" || true

      - name: Cleanup fboss-sim runtime container and image
        if: always()
        run: |
          docker stop fboss_sim_runtime_${USER} 2>/dev/null || true
          docker rm   fboss_sim_runtime_${USER} 2>/dev/null || true
          docker rmi  fboss_sim_runtime_${USER}:latest 2>/dev/null || true
          docker network rm fboss_sim_net_${USER} 2>/dev/null || true

      - name: Cleanup FBOSS container
        if: always()
        run: |
          docker stop FBOSS_build_${USER} 2>/dev/null || true
          docker rm FBOSS_build_${USER} 2>/dev/null || true

      - name: Check PR is based on latest sync
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the upstream sync commit from fboss-rev.txt on the target branch
          # The file contains "Subproject commit <sha>", so extract just the SHA
          SYNC_COMMIT=$(gh api "repos/${{ github.repository }}/contents/build/deps/github_hashes/facebook/fboss-rev.txt?ref=${{ github.base_ref }}" --jq '.content' | base64 -d | awk '{print $3}')
          # Use GitHub API to check if sync commit is an ancestor of PR HEAD,
          # this way we don't need fetch history to make this check locally.
          COMPARE=$(gh api "repos/${{ github.repository }}/compare/${SYNC_COMMIT}...${{ github.event.pull_request.head.sha }}" --jq '.status')
          echo "We are $COMPARE relative to upstream sync commit $SYNC_COMMIT"

          if [[ "$COMPARE" != "ahead" && "$COMPARE" != "identical" ]]; then
            echo "❌ Your PR is not based on the latest upstream sync commit ($SYNC_COMMIT). Please rebase your branch."
            exit 1
          fi
          echo "✅ PR is based on latest sync commit"
