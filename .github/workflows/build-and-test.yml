name: Build and Test
run-name: Build and Test FBOSS (SAI ${{ inputs.sai_version }})

on:
  workflow_call:
    inputs:
      sai_version:
        description: "SAI version to build against"
        required: false
        default: "1.16.1"
        type: string
      use_clang:
        description: "Use Clang instead of GCC"
        required: false
        default: false
        type: boolean
      ref:
        description: "Git ref to checkout (branch, tag, or SHA)"
        required: false
        default: ""
        type: string
    outputs:
      failed_tests:
        description: "List of failed tests (up to 10)"
        value: ${{ jobs.Build-and-Test.outputs.failed_tests }}
      failed_test_count:
        description: "Total number of failed tests"
        value: ${{ jobs.Build-and-Test.outputs.failed_test_count }}

jobs:
  Build-and-Test:
    if: github.repository_owner == 'nexthop-ai'
    runs-on: [self-hosted, fboss-gha]
    outputs:
      failed_tests: ${{ steps.parse-test-results.outputs.failed_tests }}
      failed_test_count: ${{ steps.parse-test-results.outputs.failed_test_count }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          # We'll clean the workspace ourselves to preserve most of .build_dir
          # so keep vendored dependencies across builds.
          clean: false
          # For PRs, checkout the actual PR head (not the synthetic merge commit)
          ref: ${{ inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.ref }}
          # Most PRs will be fewer than 20 commits
          fetch-depth: 20

      - name: Fetch base branch and deepen history for PR diff
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base branch so we can compute merge-base
          git fetch --no-tags origin ${{ github.base_ref }}
          # Deepen history until merge-base is found
          DEPTH=${{ github.event.pull_request.commits }}
          while ! git merge-base origin/${{ github.base_ref }} HEAD >/dev/null 2>&1; do
            DEPTH=$(( DEPTH + 50 ))
            git fetch --deepen=$DEPTH --no-tags origin ${{ github.base_ref }} ${{ github.head_ref }}
          done

      - name: Clean workspace
        run: |
          sudo git clean -ffdxe .build_dir
          sudo rm -rf .build_dir/build/fboss .build_dir/installed/fboss

      - name: Cleanup any existing container
        run: |
          docker stop FBOSS_build_${USER} 2>/dev/null || true
          docker rm FBOSS_build_${USER} 2>/dev/null || true

      - name: Build FBOSS Docker image
        env:
          USE_CLANG: ${{ inputs.use_clang }}
        run: ./fboss/oss/scripts/nhfboss-docker-build.py

      - name: Prune dangling images
        run: docker image prune -f

      - name: Start FBOSS build container
        run: ./fboss/oss/scripts/nhfboss-docker-enter.py

      - name: Prepare SAI
        run: |
          docker exec FBOSS_build_${USER} ./fboss/oss/scripts/build-helper.py \
            /var/extras/sai/${{ inputs.sai_version }} \
            /var/extras/sai/${{ inputs.sai_version }} \
            /var/extras/sai/${{ inputs.sai_version }} \
            ${{ inputs.sai_version }} \
            --skip-archive-creation

      - name: Fetch dependencies
        run: |
          docker exec FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-get-deps.sh

      - name: Build FBOSS
        run: |
          # Only install the final binaries for scheduled events (nightly builds).
          # Other workflows don't need them and they're expensive to install.
          target=${{ github.event_name == 'schedule' && 'install' || 'all' }}
          docker exec -e SAI_VERSION=${{ inputs.sai_version }} FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target $target
          docker cp FBOSS_build_${USER}:/var/FBOSS/tmp_bld_dir/build/fboss/fboss2-dev ./fboss2-dev
          docker cp FBOSS_build_${USER}:/var/FBOSS/tmp_bld_dir/build/fboss/fboss2_integration_test ./fboss2_integration_test

      - name: Collect sccache statistics
        if: always()
        run: |
          docker exec FBOSS_build_${USER} sccache -s

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fboss2_integration_test
          path: ./fboss2_integration_test

      - name: Upload fboss2-dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: fboss2-dev
          path: ./fboss2-dev

      - name: Parse NHCI annotations
        id: nhci
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Parse NHCI annotations from PR body
          # Format: NHCI: key=value
          # Supported: clang-tidy=skip|warn-only
          CLANG_TIDY_MODE="normal"
          if echo "$PR_BODY" | grep -qF "NHCI: clang-tidy=skip"; then
            echo "Found 'NHCI: clang-tidy=skip' in PR body, skipping clang-tidy entirely"
            CLANG_TIDY_MODE="skip"
          elif echo "$PR_BODY" | grep -qF "NHCI: clang-tidy=warn-only"; then
            echo "Found 'NHCI: clang-tidy=warn-only' in PR body, clang-tidy errors will not fail the build"
            CLANG_TIDY_MODE="warn-only"
          fi
          echo "clang_tidy_mode=$CLANG_TIDY_MODE" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy
        id: clang-tidy
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip'
        run: |
          echo "Current HEAD: $(git rev-parse HEAD)"

          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # For sync PRs, find the merge commit and use it as base (so we only lint our changes, not upstream)
          SYNC_MERGE_COMMIT=$(git log ${MERGE_BASE}..HEAD --first-parent --merges --grep="^Sync with upstream stable commit" -1 --format="%H" 2>/dev/null || true)
          if [[ -n "$SYNC_MERGE_COMMIT" ]]; then
            echo "Detected sync PR with merge commit: $SYNC_MERGE_COMMIT"
            BASE_REF="$SYNC_MERGE_COMMIT"
          else
            echo "PR merge-base: $MERGE_BASE"
            BASE_REF="$MERGE_BASE"
          fi

          # Save BASE_REF for reviewdog step
          echo "$BASE_REF" > /tmp/clang_tidy_base_ref.txt

          # Run clang-tidy on all C++ files changed in this PR and save output for reviewdog
          docker exec -e BASE_REF="$BASE_REF" FBOSS_build_${USER} bash -c '
            cd /var/FBOSS/fboss
            python3 fboss/oss/scripts/run-clang-tool.py --no-run-if-empty --range "$BASE_REF..HEAD" 2>&1
          ' | tee /tmp/clang-tidy-output.txt
          if [[ ! -s /tmp/clang-tidy-output.txt ]]; then
            echo "clang-tidy produced no output, everything's perfectly tidy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Post-process clang-tidy output:
          # - Strip container path prefix so reviewdog can find files
          # - Add helpful suggestions for banned headers
          sed -i \
            -e 's|/var/FBOSS/fboss/||g' \
            -e 's/system include regex not allowed/system include regex not allowed (use RE2 instead)/g' \
            /tmp/clang-tidy-output.txt

      - name: Setup reviewdog
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip' && steps.clang-tidy.outputs.skip != 'true'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Post clang-tidy comments
        if: github.event_name == 'pull_request' && steps.nhci.outputs.clang_tidy_mode != 'skip' && steps.clang-tidy.outputs.skip != 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_REF=$(cat /tmp/clang_tidy_base_ref.txt 2>/dev/null || echo "origin/${{ github.base_ref }}")
          FAIL_LEVEL="${{ steps.nhci.outputs.clang_tidy_mode == 'warn-only' && 'none' || 'error' }}"
          cat /tmp/clang-tidy-output.txt | \
            reviewdog \
              -efm="%f:%l:%c: %tarning: %m" \
              -efm="%f:%l:%c: %trror: %m" \
              -name="clang-tidy" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -fail-level="$FAIL_LEVEL" \
              -diff="git diff $BASE_REF..HEAD"

      - name: Run unit tests
        id: run-tests
        run: |
          docker exec FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-test.sh 2>&1 | tee /tmp/test_output.log
          exit ${PIPESTATUS[0]}

      - name: Parse test results
        id: parse-test-results
        if: always()
        run: |
          if [[ -f /tmp/test_output.log ]]; then
            # Extract failed test names from CTest output
            # Format: "	 46 - CmdShowHostTestFixture.sortModel (Failed)"
            all_failed=$(sed -nE '/The following tests FAILED:/,$ s/^\s+[0-9]+ - (.+) \(Failed\)$/\1/p' /tmp/test_output.log)
            failed_tests=$(echo "$all_failed" | head -5)
            if [[ -n "$all_failed" ]]; then
              failed_count=$(echo "$all_failed" | wc -l)
            else
              failed_count=0
            fi

            echo "failed_test_count=$failed_count" >> "$GITHUB_OUTPUT"
            echo "failed_tests<<EOF" >> "$GITHUB_OUTPUT"
            echo "$failed_tests" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"

            echo "Found $failed_count failed test(s)"
            if [[ -n "$all_failed" ]]; then
              echo "Failed tests:"
              echo "$all_failed"
            fi
          else
            # File doesn't exist - tests never ran (build likely failed earlier)
            echo "failed_test_count=" >> "$GITHUB_OUTPUT"
            echo "failed_tests=" >> "$GITHUB_OUTPUT"
            echo "Test output not found - tests did not run (build may have failed)"
          fi

      - name: Clean build directory for fake SAI build
        run: |
          # Remove build artifacts
          sudo rm -rf .build_dir/build/fboss .build_dir/installed/fboss .build_dir/installed/sai_impl-*
          # Revert/remove manifests modified/created by build-helper.py (testing on host due to bind mount)
          git checkout build/fbcode_builder/manifests/libsai build/fbcode_builder/manifests/fboss
          rm -f build/fbcode_builder/manifests/sai_impl

      - name: Build FBOSS with Fake SAI
        run: |
          docker exec -e SAI_IMPL=fake FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target fboss_fake_agent_targets
          docker exec -e SAI_IMPL=fake FBOSS_build_${USER} ./fboss/oss/scripts/nhfboss-build.sh --cmake-target fboss2_targets

      - name: Build fboss-sim runtime image
        run: python3 fboss-sim/scripts/fboss-sim-docker-package.py

      - name: Start fboss-sim runtime container
        run: python3 fboss-sim/scripts/fboss-sim-docker-run.py

      - name: Wait for agent services to be ready
        run: |
          for i in $(seq 1 5); do
            elapsed=$(( (i - 1) * 2 ))
            if docker exec fboss_sim_runtime_${USER} /opt/fboss/bin/fboss2 show interface 2>/dev/null; then
              echo "✓ Agent ready after ${elapsed}s"
              exit 0
            fi
            echo "  [${elapsed}s] not ready yet, retrying..."
            sleep 2
          done
          echo "❌ Agent not ready after 10s"
          docker exec fboss_sim_runtime_${USER} tail -n 50 /var/facebook/logs/fboss/wedge_agent.log || true
          exit 1

      - name: Detect changed files
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cli:
              - 'fboss/cli/**'

      - name: Run fboss2 integration test
        if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.changes.outputs.cli == 'true'
        run: |
          docker exec fboss_sim_runtime_${USER} /opt/fboss/bin/fboss2_integration_test

      - name: Cleanup fboss-sim runtime container and image
        if: always()
        run: |
          docker stop fboss_sim_runtime_${USER} 2>/dev/null || true
          docker rm   fboss_sim_runtime_${USER} 2>/dev/null || true
          docker rmi  fboss_sim_runtime_${USER}:latest 2>/dev/null || true
          docker network rm fboss_sim_net_${USER} 2>/dev/null || true

      - name: Cleanup FBOSS container
        if: always()
        run: |
          docker stop FBOSS_build_${USER} 2>/dev/null || true
          docker rm FBOSS_build_${USER} 2>/dev/null || true

      - name: Check PR is based on latest sync
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the upstream sync commit from fboss-rev.txt on the target branch
          # The file contains "Subproject commit <sha>", so extract just the SHA
          SYNC_COMMIT=$(gh api "repos/${{ github.repository }}/contents/build/deps/github_hashes/facebook/fboss-rev.txt?ref=${{ github.base_ref }}" --jq '.content' | base64 -d | awk '{print $3}')
          # Use GitHub API to check if sync commit is an ancestor of PR HEAD,
          # this way we don't need fetch history to make this check locally.
          COMPARE=$(gh api "repos/${{ github.repository }}/compare/${SYNC_COMMIT}...${{ github.event.pull_request.head.sha }}" --jq '.status')
          echo "We are $COMPARE relative to upstream sync commit $SYNC_COMMIT"

          if [[ "$COMPARE" != "ahead" && "$COMPARE" != "identical" ]]; then
            echo "❌ Your PR is not based on the latest upstream sync commit ($SYNC_COMMIT). Please rebase your branch."
            exit 1
          fi
          echo "✅ PR is based on latest sync commit"
