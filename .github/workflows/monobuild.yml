name: Monobuild

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  monobuild:
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: nexthop-ai/nh/.github/workflows/monobuild.reusable.yml@main
    with:
      submodule: fboss
      use-nh-ci-app: true
    secrets:
      GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
      NH_CI_APP_PRIVATE_KEY: ${{ secrets.NH_CI_APP_PRIVATE_KEY }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
    name: Monobuild

  # Smoke tests for upstream sync PRs only — gated on the PR title produced
  # by sync-upstream.yml. Other PRs/pushes/merge-groups skip this job.
  smoke-tests:
    name: Smoke Tests
    needs: monobuild
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == '[sync] Sync with upstream stable commit' &&
      needs.monobuild.result == 'success' &&
      needs.monobuild.outputs.build_id != ''
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/fboss-sync-smoke.reusable.yml
    with:
      build_id: ${{ needs.monobuild.outputs.build_id }}
      # Wait & Verify self-limits via poll_budget_minutes (30m) and is then
      # re-run by fboss-smoke-retry.yml until all batches resolve; this is
      # just the hard safety cap for a wedged wait job.
      timeout_minutes: 45
    secrets:
      GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
      AWS_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AWS_NEXIS_BUILDRUNNER_SSH_KEY }}
      AZURE_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AZURE_NEXIS_BUILDRUNNER_SSH_KEY }}
      NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY: ${{ secrets.NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY }}
