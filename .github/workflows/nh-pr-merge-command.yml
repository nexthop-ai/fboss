name: NH PR Merge Command

on:
  issue_comment:
    types: [created]

jobs:
  merge-pr:
    name: Merge sync PR with merge commit
    # Only run on PR comments containing /merge
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/merge')
    runs-on: cloudstack-ubuntu24-small
    outputs:
      pr_title: ${{ steps.pr-details.outputs.pr_title }}
      stable_commit: ${{ steps.pr-details.outputs.stable_commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RABBIT_NEXTHOP_PAT }}

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}

          # Get PR details
          pr_data=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER})

          # Extract relevant fields
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(echo "$pr_data" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          echo "pr_state=$(echo "$pr_data" | jq -r '.state')" >> "$GITHUB_OUTPUT"
          echo "pr_mergeable=$(echo "$pr_data" | jq -r '.mergeable')" >> "$GITHUB_OUTPUT"
          echo "pr_merged=$(echo "$pr_data" | jq -r '.merged')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$pr_data" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$pr_data" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"

          # Extract stable commit from PR title if it's a sync PR
          stable_commit=$(echo "$pr_data" | jq -r '.body' | grep -oP '(?<=\*\*Stable Commit:\*\* `)[a-f0-9]+(?=`)' || echo "")
          echo "stable_commit=${stable_commit}" >> "$GITHUB_OUTPUT"

      - name: Validate this is a sync PR
        run: |
          PR_TITLE="${{ steps.pr-details.outputs.pr_title }}"
          HEAD_REF="${{ steps.pr-details.outputs.head_ref }}"

          if [[ ! "$PR_TITLE" =~ ^\[sync\]\ Sync\ with\ upstream ]]; then
            REASON="This workflow only works for sync PRs. PR title must start with '[sync] Sync with upstream'"
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi

          if [[ ! "$HEAD_REF" =~ ^sync-fboss-upstream- ]]; then
            REASON="This workflow only works for sync PRs. Branch must start with 'sync-fboss-upstream-'"
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "✅ Validated this is a sync PR"

      - name: Check for conflict markers
        run: |
          # Check for git conflict markers in the codebase
          # Don't check for the "=" sign because of false positives
          echo "Checking for conflict markers..."
          if git grep -nE '^([<|>]{7})( |$)'; then
            REASON="Conflict markers detected in the codebase. Please resolve all conflicts before merging."
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "✅ No conflict markers found"

      - name: Check PR is open
        if: steps.pr-details.outputs.pr_state != 'open'
        run: |
          REASON="PR is not open (state: ${{ steps.pr-details.outputs.pr_state }})"
          echo "❌ $REASON"
          echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
          exit 1

      - name: Check PR is not already merged
        if: steps.pr-details.outputs.pr_merged == 'true'
        run: |
          REASON="PR is already merged"
          echo "❌ $REASON"
          echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
          exit 1

      - name: Check PR reviews
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ steps.pr-details.outputs.pr_number }}

          # Get reviews
          reviews=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews)

          # Check if there's at least one approval
          approved=$(echo "$reviews" | jq '[.[] | select(.state == "APPROVED")] | length > 0')

          if [[ "$approved" != "true" ]]; then
            REASON="PR has not been approved by at least one reviewer"
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "✅ PR #${PR_NUMBER} has been approved"

      - name: Check PR status checks
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ steps.pr-details.outputs.pr_number }}
          HEAD_SHA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} | jq -r '.head.sha')

          # Get required checks from repository rulesets
          BASE_REF=${{ steps.pr-details.outputs.base_ref }}

          # Get all active rulesets (list endpoint only provides summary, not conditions)
          rulesets=$(gh api repos/${{ github.repository }}/rulesets 2>/dev/null || echo '[]')

          # Get IDs of all active rulesets
          ruleset_ids=$(jq <<<"$rulesets" -r '.[] | select(.enforcement == "active") | .id' 2>/dev/null || true)

          # Find all rulesets that apply to the base branch and accumulate required status checks
          # Note: GitHub enforces ALL matching rulesets, not just the first one
          required_checks=""
          ref_name="refs/heads/${BASE_REF}"

          while IFS= read -r ruleset_id; do
            [[ -z "$ruleset_id" ]] && continue

            # Fetch full ruleset details (includes conditions and rules)
            ruleset_details=$(gh api "repos/${{ github.repository }}/rulesets/${ruleset_id}" 2>/dev/null || echo '{}')

            # Check if this ruleset applies to the base branch
            # Handle both exact matches and fnmatch patterns (e.g., refs/heads/release/*)
            # Also check exclude patterns to avoid false positives
            applies_to_branch=$(jq <<<"$ruleset_details" -r --arg ref "$ref_name" '
              # Check if ref matches any include pattern
              (.conditions.ref_name.include // [] |
                map(
                  if . == "~DEFAULT_BRANCH" then
                    # Special token for default branch
                    ($ref == "refs/heads/${{ github.event.repository.default_branch }}")
                  else
                    # Exact match or pattern match (simplified - exact match only for now)
                    # TODO: Full fnmatch support would require shell pattern matching
                    ($ref == .)
                  end
                ) | any
              ) and
              # Check that ref does not match any exclude pattern
              ((.conditions.ref_name.exclude // [] |
                map($ref == .) | any
              ) | not)
            ' 2>/dev/null || echo "false")

            if [[ "$applies_to_branch" == "true" ]]; then
              # Extract required status checks from this ruleset
              checks=$(jq <<<"$ruleset_details" -r '
                .rules[]? |
                select(.type == "required_status_checks") |
                .parameters.required_status_checks[]? |
                .context
              ' 2>/dev/null || true)

              if [[ -n "$checks" ]]; then
                # Accumulate checks from all matching rulesets (don't break early)
                if [[ -z "$required_checks" ]]; then
                  required_checks="$checks"
                else
                  required_checks=$(printf "%s\n%s" "$required_checks" "$checks" | sort -u)
                fi
              fi
            fi
          done <<< "$ruleset_ids"

          # Fetch the combined commit status once. The combined endpoint deduplicates
          # per context server-side, returning only the most recent state per context,
          # so we can look up any required status by context without paginating.
          commit_statuses=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/status?per_page=100")

          # Find failed or incomplete required checks
          failed_required=()
          pending_required=()
          while IFS= read -r check_name; do
            [[ -z "$check_name" ]] && continue

            # Query the check-runs API filtered to this specific check name with
            # filter=latest. This returns only the latest run per check_suite for the
            # given name, so we don't have to fetch and paginate through every run on
            # the commit (which on sync PRs can include dozens of cancelled re-runs).
            # If multiple suites still produce a run with the same name, pick the
            # highest id (most recent).
            encoded_name=$(jq -rn --arg n "$check_name" '$n|@uri')
            check_info=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs?check_name=${encoded_name}&filter=latest&per_page=100" \
              | jq -r '
                  [.check_runs[]] |
                  sort_by(.id) | reverse |
                  .[0] // empty |
                  "\(.status)|\(.conclusion)"
                ')

            # If not found in check runs, try commit statuses. The combined /status
            # endpoint already returns one entry per context (the latest), so no
            # client-side dedup is required.
            if [[ -z "$check_info" ]]; then
              status_info=$(jq <<<"$commit_statuses" -r --arg name "$check_name" '
                .statuses[]? | select(.context == $name) | .state
              ')
              if [[ -n "$status_info" ]]; then
                # Convert status state to check run format
                case "$status_info" in
                  success)
                    check_info="completed|success"
                    ;;
                  failure)
                    check_info="completed|failure"
                    ;;
                  error)
                    check_info="completed|failure"
                    ;;
                  pending)
                    check_info="in_progress|pending"
                    ;;
                esac
              fi
            fi

            if [[ -z "$check_info" ]]; then
              # Check not found in either - treat as pending
              pending_required+=("$check_name")
            else
              status=$(echo "$check_info" | cut -d'|' -f1)
              conclusion=$(echo "$check_info" | cut -d'|' -f2)

              if [[ "$conclusion" == "failure" ]]; then
                failed_required+=("$check_name")
              elif [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "✅ Required check '$check_name' passed"
              else
                pending_required+=("$check_name")
              fi
            fi
          done <<< "$required_checks"

          # Check if there are any failed required checks
          if [[ ${#failed_required[@]} -gt 0 ]]; then
            failed_list=$(IFS=', '; echo "${failed_required[*]}")
            if [[ ${#failed_required[@]} -gt 1 ]]; then
              plural="s"
            else
              plural=""
            fi
            REASON="PR has ${#failed_required[@]} failed required check${plural}: ${failed_list}"
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi

          # Check if there are any pending required checks
          if [[ ${#pending_required[@]} -gt 0 ]]; then
            pending_list=$(IFS=', '; echo "${pending_required[*]}")
            if [[ ${#pending_required[@]} -gt 1 ]]; then
              plural="s"
            else
              plural=""
            fi
            REASON="PR has ${#pending_required[@]} required check${plural} that have not completed: ${pending_list}"
            echo "❌ $REASON"
            echo "FAILURE_REASON=$REASON" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "✅ All required checks passed or skipped for PR #${PR_NUMBER}"

      - name: Resolve merge guard threads
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          .github/scripts/resolve_sync_merge_guard.sh "${{ steps.pr-details.outputs.pr_number }}"

      - name: Merge PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ steps.pr-details.outputs.pr_number }}
          PR_TITLE="${{ steps.pr-details.outputs.pr_title }}"
          STABLE_COMMIT="${{ steps.pr-details.outputs.stable_commit }}"

          # Determine commit title
          if [[ -n "$STABLE_COMMIT" ]]; then
            COMMIT_TITLE="[sync] Merge upstream stable commit ${STABLE_COMMIT}"
          else
            COMMIT_TITLE="${PR_TITLE}"
          fi

          echo "Merging PR #${PR_NUMBER} with commit title: ${COMMIT_TITLE}"

          # Merge the PR using GitHub API
          gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/merge \
            --method PUT \
            --field merge_method=merge \
            --field commit_title="${COMMIT_TITLE}" \
            > /tmp/merge_result.json

          merge_sha=$(jq -r '.sha' /tmp/merge_result.json)
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
          echo "✅ Successfully merged PR #${PR_NUMBER} (merge commit: ${merge_sha})"

      - name: Delete sync branch
        if: success() && startsWith(steps.pr-details.outputs.head_ref, 'sync-fboss-upstream-')
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          HEAD_REF="${{ steps.pr-details.outputs.head_ref }}"
          echo "Deleting sync branch: ${HEAD_REF}"
          git push origin --delete "${HEAD_REF}" || echo "⚠️ Failed to delete branch ${HEAD_REF}"

      - name: Comment on PR (success)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ steps.pr-details.outputs.pr_number }}
          MERGE_SHA=${{ steps.merge.outputs.merge_sha }}

          gh pr comment ${PR_NUMBER} --body "✅ Successfully merged with merge commit \`${MERGE_SHA}\`"

      - name: Comment on PR (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          PR_NUMBER=${{ steps.pr-details.outputs.pr_number }}
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Get failure reason from GITHUB_ENV (set by whichever step failed)
          REASON="${{ env.FAILURE_REASON }}"
          if [[ -z "$REASON" ]]; then
            REASON="Merge failed. Please check the workflow run for details."
          fi

          gh pr comment ${PR_NUMBER} --body "❌ Failed to merge PR: ${REASON}

          See [workflow run](${WORKFLOW_URL}) for details."

  # Slack notification: sync PR merged successfully
  notify-sync-merged:
    name: Notify Slack (Sync PR Merged)
    needs: merge-pr
    if: success() && startsWith(needs.merge-pr.outputs.pr_title, '[sync]')
    runs-on: cloudstack-ubuntu24-small
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": ":merged: Sync <https://github.com/nexthop-ai/private-fboss/pull/${{ github.event.issue.number }}|PR #${{ github.event.issue.number }}> has been successfully merged to main. Upstream stable commit: `${{ needs.merge-pr.outputs.stable_commit }}`"
            }
