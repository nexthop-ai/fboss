name: Nightly Build
run-name: Nightly Build - Full FBOSS

on:
  # Allow manually triggering the workflow
  workflow_dispatch:
  # 7:00 PM IST (13:30 UTC) and 7:00 PM PST / 8:00 PM PDT (03:00 UTC)
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 3 * * *"

jobs:
  build-and-test-clang:
    uses: ./.github/workflows/build-and-test.yml
    with:
      sai_version: "1.16.1"
      use_clang: true

  monobuild:
    permissions:
      id-token: write
      contents: read
    uses: nexthop-ai/nh/.github/workflows/monobuild.reusable.yml@main
    with:
      submodule: fboss
      nh_branch: main
    secrets:
      GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
  read-smoke-tests:
    name: Read smoke test list
    runs-on: cloudstack-ubuntu24-small
    outputs:
      tests: ${{ steps.smoke.outputs.tests }}
    steps:
      - uses: nexthop-ai/nh/.github/actions/gitproxy-checkout@main
        with:
          token: ${{ secrets.RABBIT_NEXTHOP_PAT }}
          repository: nexthop-ai/private-fboss
      - id: smoke
        shell: bash
        run: echo "tests=$(paste -sd, .github/fboss-smoke-tests.txt)" >> "$GITHUB_OUTPUT"

  fboss-smoke-tests:
    needs: [monobuild, read-smoke-tests]
    if: ${{ needs.monobuild.result == 'success' && needs.monobuild.outputs.build_id != '' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        testbed_config:
          - name: "Gold Eagle Testbeds"
            pattern: "gold[2-9].*"
            priority: 75
          - name: "Wedge Testbeds"
            pattern: "wdg10.*"
            priority: 75
          - name: "Cisco Wedge Testbeds"
            pattern: "wdg15.*"
            priority: 75
          - name: "FBOSS Testbeds"
            pattern: "fboss.*"
            priority: 75
          - name: "Black Kite Testbeds"
            pattern: "blkt.*"
            priority: 75
    uses: ./.github/workflows/fboss-itest.reusable.yml
    with:
      build_id: ${{ needs.monobuild.outputs.build_id }}
      priority: ${{ matrix.testbed_config.priority }}
      target_testbeds: ${{ matrix.testbed_config.pattern }}
      tests: ${{ needs.read-smoke-tests.outputs.tests }}
    secrets:
      GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
      AWS_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AWS_NEXIS_BUILDRUNNER_SSH_KEY }}
      AZURE_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AZURE_NEXIS_BUILDRUNNER_SSH_KEY }}
      NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY: ${{ secrets.NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY }}
    name: ${{ matrix.testbed_config.name }}
  notify-slack-on-failure:
    runs-on: cloudstack-ubuntu24-small
    needs: [build-and-test-clang, monobuild, fboss-smoke-tests]
    if: failure()
    steps:
      - name: Determine which builds failed and collect test failures
        id: check-failures
        run: |
          CLANG_RESULT="${{ needs.build-and-test-clang.result }}"
          CLANG_FAILED_TESTS="${{ needs.build-and-test-clang.outputs.failed_tests }}"
          CLANG_FAILED_COUNT="${{ needs.build-and-test-clang.outputs.failed_test_count }}"
          MONOBUILD_RESULT="${{ needs.monobuild.result }}"

          # Determine which builds failed
          FAILED=""
          [[ "$CLANG_RESULT" == "failure" ]] && FAILED="Clang build"
          [[ "$MONOBUILD_RESULT" == "failure" ]] && FAILED="${FAILED:+$FAILED, }Monobuild"

          if [[ -n "$FAILED" ]]; then
            echo "failed_builds=$FAILED" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
          else
            echo "failed_builds=Unknown" >> "$GITHUB_OUTPUT"
            echo "emoji=:warning:" >> "$GITHUB_OUTPUT"
          fi

          # Build test failure details (show max 5 inline, full list in workflow logs)
          format_failures() {
            local label="$1" count="$2" tests="$3"
            local details="" shown=0
            if [[ -n "$tests" ]]; then
              details="*${label} (${count:-?} failed):* "
              while IFS= read -r test && [[ $shown -lt 5 ]]; do
                [[ -n "$test" ]] && details+="\`$test\` " && ((shown++))
              done <<< "$tests"
              [[ "${count:-0}" -gt 5 ]] && details+="_(+$((count - 5)) more)_"
            fi
            echo "$details"
          }

          test_details=""
          [[ "$CLANG_RESULT" == "failure" ]] && test_details+=$(format_failures "Clang" "$CLANG_FAILED_COUNT" "$CLANG_FAILED_TESTS")

          # If no test details, might be a build failure
          if [[ -z "$test_details" ]]; then
            test_details="Build or infrastructure failure (no test results available)"
          fi

          echo "test_details<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$test_details" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "${{ steps.check-failures.outputs.emoji }} Nightly Build Failed: ${{ steps.check-failures.outputs.failed_builds }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.check-failures.outputs.emoji }} Nightly Build Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed:* ${{ steps.check-failures.outputs.failed_builds }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJson(steps.check-failures.outputs.test_details) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
