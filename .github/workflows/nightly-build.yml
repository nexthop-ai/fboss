name: Nightly Build
run-name: Nightly Build - Full FBOSS

on:
  # Allow manually triggering the workflow
  workflow_dispatch:
  # 7:00 PM IST (13:30 UTC) and 7:00 PM PST / 8:00 PM PDT (03:00 UTC)
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 3 * * *"

jobs:
  nightly:
    name: Nightly (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - nh-fboss-cefe-eft2
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/nightly-build-branch.reusable.yml
    with:
      branch: ${{ matrix.branch }}
    secrets: inherit
