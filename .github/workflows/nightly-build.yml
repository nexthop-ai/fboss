name: Nightly Build
run-name: Nightly Build - Full FBOSS

on:
  # Allow manually triggering the workflow
  workflow_dispatch:
    inputs:
      branches:
        description: "Branches to build, comma-separated (e.g. main,nh-fboss-cefe-eft2). Empty = read the list from Tide's config in nh-config."
        required: false
        default: ""
  # 7:00 PM IST (13:30 UTC) and 7:00 PM PST / 8:00 PM PDT (03:00 UTC)
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 3 * * *"

jobs:
  # Which branches to build — see nightly-resolve-branches.reusable.yml.
  resolve-branches:
    uses: ./.github/workflows/nightly-resolve-branches.reusable.yml
    with:
      branches: ${{ inputs.branches }}
    secrets: inherit

  nightly:
    name: Nightly (${{ matrix.branch }})
    needs: resolve-branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.resolve-branches.outputs.branches) }}
    permissions:
      id-token: write
      contents: read
      actions: read
      # fboss-sim-cli.yml requests pull-requests: read for dorny/paths-filter.
      # A nested reusable workflow can only narrow the caller's permissions, so
      # omitting it here fails the whole run at startup.
      pull-requests: read
    uses: ./.github/workflows/nightly-build-branch.reusable.yml
    with:
      branch: ${{ matrix.branch }}
    secrets: inherit

  # Stamps the PRs and Jira tickets that shipped in this nightly. The annotator
  # lives in nh (nightly-build-annotate.yml) and reads this run's builds from
  # Nexis; workflow_run cannot cross repos, so it is dispatched from here. Runs
  # whatever the build outcome: per-branch build status in Nexis decides what
  # gets stamped, and a failed branch must not silence the passing ones. Only a
  # scheduled run is a nightly; a manual run of this workflow stamps nothing.
  annotate:
    name: Annotate PRs and Jira
    needs: nightly
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: k8s-nano
    # Annotation is best-effort; a dispatch failure must not red the nightly.
    continue-on-error: true
    permissions: {}
    steps:
      - name: Dispatch nh nightly-build-annotate
        env:
          GH_TOKEN: ${{ secrets.RABBIT_NEXTHOP_PAT }}
        run: |
          gh workflow run nightly-build-annotate.yml --repo nexthop-ai/nh --ref main \
            -f run_id="${{ github.run_id }}" -f nightly=fboss -f dry_run=false
