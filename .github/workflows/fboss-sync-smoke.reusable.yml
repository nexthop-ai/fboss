name: FBOSS Sync Smoke Tests
# Pre-merge gate for fboss upstream syncs. Sequentially schedules a test
# batch for each testbed pool, then a single wait job polls all batches in
# parallel and reports failures. The PR sees 2 check rows (Schedule pools
# and Wait & Verify); only Wait & Verify is long-running, so during the
# polling phase only one check is in-progress.

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "Token used to clone nh repo"
        required: true
      AWS_NEXIS_BUILDRUNNER_SSH_KEY:
        required: true
      AZURE_NEXIS_BUILDRUNNER_SSH_KEY:
        required: true
      NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY:
        required: true
    inputs:
      build_id:
        description: "Build ID produced by monobuild for the candidate fboss SHA"
        required: true
        type: string
      timeout_minutes:
        description: "Job-level timeout for the wait phase (covers the slowest pool). Required (no default) so the choice is visible at every top-level call site rather than absorbed by a default."
        required: true
        type: number
      poll_interval_seconds:
        description: "Seconds between polls per batch."
        required: false
        type: number
        default: 180
      poll_budget_minutes:
        description: >-
          Wall-clock polling budget for the wait phase. If batches are still
          unresolved when it expires, Wait & Verify fails as SMOKE_RETRYABLE
          and fboss-smoke-retry.yml re-runs it later.
        required: false
        type: number
        default: 30

jobs:
  schedule-all:
    name: Schedule pools
    runs-on: cloudstack-ubuntu24-micro
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      batches: ${{ steps.aggregate.outputs.batches }}

    steps:
      - name: Checkout
        uses: nexthop-ai/nh/.github/actions/gitproxy-checkout@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: nexthop-ai/private-fboss
      - name: Read smoke test list
        id: smoke
        shell: bash
        run: echo "tests=$(paste -sd, .github/fboss-smoke-tests.txt)" >> "$GITHUB_OUTPUT"

      - name: Install NHTools
        uses: nexthop-ai/nh/.github/actions/install-nhtools@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          aws_ssh_key: ${{ secrets.AWS_NEXIS_BUILDRUNNER_SSH_KEY }}
          azure_ssh_key: ${{ secrets.AZURE_NEXIS_BUILDRUNNER_SSH_KEY }}
          taskrabbit_ssh_key: ${{ secrets.NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::867344435357:role/GitHubActions-EC2-Role
          aws-region: us-east-2
          role-duration-seconds: 14400
          output-env-credentials: true

      # Scheduling is idempotent per (build_id, product): batch IDs live in
      # a per-build JSON map in the actions cache, so a re-run (even "Re-run
      # all jobs", or a retry after this job died mid-way through the pools)
      # reuses the batches already scheduled instead of scheduling
      # duplicates. The map is saved under a per-attempt key (save keys are
      # immutable) and restored by build_id prefix, so partial progress from
      # a failed attempt is preserved. Cache entries are branch-scoped and
      # expire after ~7 days without access; a spurious eviction merely
      # causes a redundant (harmless) reschedule.
      - name: Restore batch IDs scheduled by previous attempts
        uses: actions/cache/restore@v6
        with:
          path: .nh-batch-cache/batches.json
          key: fboss-batches-${{ inputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fboss-batches-${{ inputs.build_id }}-

      - name: Schedule all pools
        id: aggregate
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PRIORITY: 100
          TESTS: ${{ steps.smoke.outputs.tests }}
        run: |
          set -uo pipefail

          # The single place the pool list lives; the product name doubles
          # as the display name in the wait job's polling log.
          POOLS=(
            GoldenEagle320
            WEDGE800BACT
            WEDGE800CACT
            MINIPACK3
            CrownedEagle
            FriscoEagle
            StellerEagle
          )

          map_file=".nh-batch-cache/batches.json"
          mkdir -p .nh-batch-cache
          [ -s "$map_file" ] || echo '{}' > "$map_file"

          # Let the save step know whether the map gained new entries, even
          # if a later pool's scheduling fails (outputs written before a
          # failure survive it).
          echo "scheduled_new=false" >> "$GITHUB_OUTPUT"

          batches='[]'
          for product in "${POOLS[@]}"; do
            batch_id=$(jq -r --arg p "$product" '.[$p] // empty' "$map_file")
            if [[ "$batch_id" =~ ^[0-9]+$ ]] && [[ "$batch_id" -ne 0 ]]; then
              echo "♻️ ${product}: reusing already-scheduled batch ${batch_id}"
            else
              CMD="nh te schedule"
              CMD="$CMD --build-id $BUILD_ID"
              CMD="$CMD --test-env fboss"
              CMD="$CMD --nos fboss"
              CMD="$CMD --priority $PRIORITY"

              if [ -n "$TESTS" ]; then
                CMD="$CMD --tests $TESTS"
              else
                CMD="$CMD --all-eligible-tests"
              fi

              # Smoke tests only need single-DUT testbeds.
              CMD="$CMD --attribute dut_count=1"
              CMD="$CMD --product $product"
              CMD="$CMD --department software"

              exit_code=0
              output=$($CMD 2>&1) || exit_code=$?

              batch_id=$(echo "$output" | grep "Batch ID:" | awk '{print $3}')

              if [[ ${exit_code:-0} -ne 0 ]] || ! [[ "$batch_id" =~ ^[0-9]+$ ]] || [[ "$batch_id" -eq 0 ]]; then
                echo "⚠️ ${product}: schedule failed."
                echo "$output"
                exit 1
              fi

              echo "✅ ${product}: scheduled batch ${batch_id}"
              jq --arg p "$product" --arg b "$batch_id" '.[$p] = $b' \
                "$map_file" > "${map_file}.tmp" && mv "${map_file}.tmp" "$map_file"
              # Overwrite, not append: the last write of an output wins.
              echo "scheduled_new=true" >> "$GITHUB_OUTPUT"
            fi

            batches=$(echo "$batches" | jq --arg n "$product" --arg b "$batch_id" \
              '. + [{"pool_name": $n, "batch_id": $b}]')
          done

          echo "All pools scheduled:"
          echo "$batches" | jq

          # Multiline heredoc so jq's pretty-printed JSON (with newlines)
          # passes through GITHUB_OUTPUT cleanly.
          {
            echo "batches<<EOF"
            echo "$batches"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # always(): if scheduling died mid-way, the pools that DID get
      # scheduled must still reach the cache so the next attempt doesn't
      # schedule them again.
      - name: Save batch IDs to cache
        if: always() && steps.aggregate.outputs.scheduled_new == 'true'
        uses: actions/cache/save@v6
        with:
          path: .nh-batch-cache/batches.json
          key: fboss-batches-${{ inputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}

  wait-all:
    name: Wait & Verify
    needs: schedule-all
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/fboss-batch-wait.reusable.yml
    with:
      batches: ${{ needs.schedule-all.outputs.batches }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      poll_interval_seconds: ${{ inputs.poll_interval_seconds }}
      poll_budget_minutes: ${{ inputs.poll_budget_minutes }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      AWS_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AWS_NEXIS_BUILDRUNNER_SSH_KEY }}
      AZURE_NEXIS_BUILDRUNNER_SSH_KEY: ${{ secrets.AZURE_NEXIS_BUILDRUNNER_SSH_KEY }}
      NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY: ${{ secrets.NEXIS_BUILDRUNNER_TASKRABBIT_SSH_KEY }}
