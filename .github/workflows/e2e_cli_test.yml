name: E2E CLI Test
run-name: E2E CLI Test

on:
  # Reusable workflow - called by PR Validation after build completes
  workflow_call:

jobs:
  detect-cli-changes:
    runs-on: cloudstack-ubuntu24-small
    outputs:
      cli_changed: ${{ steps.detect.outputs.cli_changed }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect fboss/cli changes
        id: detect
        run: |
          # Only run E2E CLI tests for pull_request events with fboss/cli changes
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Non-PR event (${GITHUB_EVENT_NAME}), skipping E2E CLI tests"
            echo "cli_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > /tmp/changed_files.txt || true

          if grep -q '^fboss/cli/' /tmp/changed_files.txt; then
            echo "Detected changes under fboss/cli/ - E2E CLI tests will run"
            echo "cli_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under fboss/cli/ - skipping E2E CLI tests"
            echo "cli_changed=false" >> "$GITHUB_OUTPUT"
          fi

  E2E-CLI-Test:
    needs: detect-cli-changes
    if: needs.detect-cli-changes.outputs.cli_changed == 'true'
    runs-on: cloudstack-ubuntu24-small
    # Concurrency control: only one E2E test at a time to avoid DUT conflicts
    concurrency:
      group: e2e-cli-test-dut
      cancel-in-progress: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::867344435357:role/GitHubActions-EC2-Role
          aws-region: us-east-2
          role-duration-seconds: 14400 # 4 hours timeout
          output-env-credentials: true

      - name: Setup NHTools
        run: |
          set -e
          echo "${{ secrets.RABBIT_NEXTHOP_PAT }}" | gh auth login --with-token
          docker pull container-registry.sw.internal.nexthop.ai:443/nhtools:latest > /dev/null 2>&1
          INSTALLER=/usr/local/bin/nhtools-install
          docker run --rm --entrypoint=/bin/cat container-registry.sw.internal.nexthop.ai:443/nhtools:latest /nhtools/nhtools-install | sudo install -m 755 -o root -g root /dev/stdin /usr/local/bin/nhtools-install
          sudo /usr/local/bin/nhtools-install /usr/local/bin
          sudo sed -i -e 's/^search.*//' /etc/resolv.conf
          echo "search internal.nexthop.ai" | sudo tee -a /etc/resolv.conf > /dev/null

      - name: Download FBOSS packages from PR Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the PR head SHA when available; fall back to the current commit SHA otherwise
          HEAD_SHA="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          bash .github/scripts/download_fboss_artifacts.sh "${HEAD_SHA}"

      - name: Find successful build
        id: latest_nexis_build
        run: |
          set -e
          LATEST_BUILD_ID=$(python3 .github/scripts/find_latest_nexis_build.py)

          echo "Latest successful private-fboss build id: $LATEST_BUILD_ID"
          echo "latest_build_id=$LATEST_BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Find and claim DUT
        id: find_dut
        run: |
          set -e
          # Use Python helper to get first suitable DUT name from 'nh tb show available'
          DUT_NAME=$(python3 .github/scripts/find_dut.py gold2 || echo "")

          if [ -z "$DUT_NAME" ]; then
            echo "dut_found=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Found available DUT: $DUT_NAME"
          nh tb claim "$DUT_NAME"
          echo "dut_name=$DUT_NAME" >> "$GITHUB_OUTPUT"
          echo "dut_found=true" >> "$GITHUB_OUTPUT"

      - name: Prepare DUT
        id: prepare_dut
        if: steps.find_dut.outputs.dut_found == 'true'
        # nh tb prepare must be run from the nh directory (repo root, parent of fboss)
        working-directory: ${{ github.workspace }}
        run: |
          if ! nh tb prepare --env fboss --build-id ${{ steps.latest_nexis_build.outputs.latest_build_id }} ${{ steps.find_dut.outputs.dut_name }}; then
            echo "::warning::Failed to prepare DUT ${{ steps.find_dut.outputs.dut_name }}. Skipping E2E tests."
            echo "dut_prepared=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "dut_prepared=true" >> $GITHUB_OUTPUT

      - name: Check agent services on DUT
        id: check_agent
        if: steps.find_dut.outputs.dut_found == 'true' && steps.prepare_dut.outputs.dut_prepared == 'true'
        run: |
          set -e
          DUT_NAME="${{ steps.find_dut.outputs.dut_name }}"
          echo "Checking agent systemd services on DUT ${DUT_NAME}"

          ALL_ACTIVE=true
          for SVC in fboss_sw_agent fboss_hw_agent@0 fboss_init; do
            STATUS=$(nh dvc ssh "${DUT_NAME}" -c "systemctl is-active ${SVC}.service" 2>/dev/null || echo "inactive")
            echo "${SVC} status on ${DUT_NAME}: ${STATUS}"
            if [ "${STATUS}" != "active" ]; then
              echo "::warning::${SVC} is not active on ${DUT_NAME}."
              ALL_ACTIVE=false
            fi
          done

          if [ "${ALL_ACTIVE}" = "true" ]; then
            echo "All agent services are active on ${DUT_NAME}. Continuing with E2E CLI tests."
            echo "agent_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::One or more agent services are not active on ${DUT_NAME}. Skipping copy and E2E CLI test steps."
            echo "agent_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy CLI and test binaries to DUT
        if: steps.find_dut.outputs.dut_found == 'true' && steps.prepare_dut.outputs.dut_prepared == 'true' && steps.check_agent.outputs.agent_enabled == 'true'
        run: |
          set -e
          echo "Copying fboss2_integration_test to DUT ${{ steps.find_dut.outputs.dut_name }}:~/fboss2_integration_test"
          ls -l ./fboss2_integration_test || echo "fboss2_integration_test not found in workspace"
          if ! nh dvc scp ./fboss2_integration_test ${{ steps.find_dut.outputs.dut_name }}:~/; then
            echo "::error::Failed to copy fboss2_integration_test to DUT ${{ steps.find_dut.outputs.dut_name }}"
            exit 1
          fi

          echo "Copying fboss2-dev to DUT ${{ steps.find_dut.outputs.dut_name }}:/opt/fboss/bin/fboss2-dev"
          ls -l ./fboss2-dev || echo "fboss2-dev not found in workspace"
          if ! nh dvc scp ./fboss2-dev ${{ steps.find_dut.outputs.dut_name }}:/opt/fboss/bin; then
            echo "::error::Failed to copy fboss2-dev to DUT ${{ steps.find_dut.outputs.dut_name }}"
            exit 1
          fi

      - name: Run E2E CLI tests
        id: run_tests
        if: steps.find_dut.outputs.dut_found == 'true' && steps.prepare_dut.outputs.dut_prepared == 'true' && steps.check_agent.outputs.agent_enabled == 'true'
        run: |
          echo "Using build_id: ${{ steps.latest_nexis_build.outputs.latest_build_id }}"
          echo "Using DUT: ${{ steps.find_dut.outputs.dut_name }}"
          if ! nh dvc ssh ${{ steps.find_dut.outputs.dut_name }} -c "./fboss2_integration_test"; then
            echo "::warning::E2E CLI tests failed on DUT ${{ steps.find_dut.outputs.dut_name }}."
            echo "tests_passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "tests_passed=true" >> $GITHUB_OUTPUT

      - name: Release DUT
        if: always() && steps.find_dut.outputs.dut_found == 'true'
        run: |
          nh tb release ${{ steps.find_dut.outputs.dut_name }}
