name: TCS Artifact Job

# Tells testcase-service to (re)scan fboss when test code changes on a
# TCS-tracked branch. Fire-and-forget — TCS-side problems do not block pushes.

on:
  push:
    branches:
      - main
      # Release and EFT branches. A push runs the branch's own copy of this
      # file, so a branch is covered only if it was cut after this line landed.
      - 'nh-fboss-*'
    paths:
      - 'tests/**'
      # fboss scanner skips tests/libs/ explicitly; don't trigger on changes there.
      - '!tests/libs/**'

permissions:
  contents: read

concurrency:
  group: tcs-artifact-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    name: POST /v1/artifact-jobs
    runs-on: k8s-nano
    steps:
      - name: Trigger TCS (prod + staging)
        continue-on-error: true
        uses: nexthop-ai/nh/.github/actions/tcs-trigger-artifact-job@main
        with:
          repository: fboss
          branch: ${{ github.ref_name }}
          env: both
