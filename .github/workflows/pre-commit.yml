name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch at least 2 commits so HEAD^ exists for diffing
          fetch-depth: 2
      - name: Fetch PR history for sync merge detection
        if: github.event_name == 'pull_request' && github.event.pull_request.commits > 1
        run: |
          # Fetch enough history to find sync merge commits (PR commits + buffer)
          DEPTH=$(( ${{ github.event.pull_request.commits }} + 10 ))
          git fetch --deepen=$DEPTH --no-tags origin ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9" # pre-commit-hooks requires Python 3.9+
      - name: Determine base ref for pre-commit
        id: base-ref
        run: |
          # For sync PRs, find the merge commit titled "Sync with upstream stable commit <sha>"
          # and use it as the base ref (so we only lint commits after the merge)
          # Search only within the PR's commits (last N commits where N = PR commit count)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SYNC_MERGE_COMMIT=$(git log HEAD~${{ github.event.pull_request.commits }}..HEAD --merges --grep="^Sync with upstream stable commit" -1 --format="%H" 2>/dev/null || true)
          else
            SYNC_MERGE_COMMIT=""
          fi
          if [ -n "$SYNC_MERGE_COMMIT" ]; then
            echo "Detected sync PR with merge commit: $SYNC_MERGE_COMMIT"
            echo "base_ref=$SYNC_MERGE_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "Regular PR, using HEAD^ as base"
            echo "base_ref=HEAD^" >> $GITHUB_OUTPUT
          fi
      - name: Show changed files
        run: git diff --name-only ${{ steps.base-ref.outputs.base_ref }}...HEAD
      - uses: pre-commit/action@v3.0.1
        with:
          # replace the default extra_args = "--all-files" since we only care about the changed files for now
          extra_args: "--from-ref ${{ steps.base-ref.outputs.base_ref }} --to-ref HEAD"
