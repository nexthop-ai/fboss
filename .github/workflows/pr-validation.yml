name: PR Validation
run-name: PR Validation - Build and Test

on:
  merge_group:
  # Allow manually triggering the workflow
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test-clang:
    uses: ./.github/workflows/build-and-test.yml
    with:
      sai_version: "1.16.1"
      use_clang: true
