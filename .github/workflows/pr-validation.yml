name: PR Validation
run-name: PR Validation - Build and Test

on:
  merge_group:
  # Allow manually triggering the workflow
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write  # Required for aws-actions/configure-aws-credentials (OIDC to assume AWS role)
  contents: read
  pull-requests: write
  actions: read  # Required for gh run list used by integration_test workflow

jobs:
  build-and-test-clang:
    uses: ./.github/workflows/build-and-test.yml
    with:
      sai_version: "1.16.1"
      use_clang: true

  cli-integration-test:
    needs: build-and-test-clang
    uses: ./.github/workflows/integration_test.yml
    secrets: inherit
